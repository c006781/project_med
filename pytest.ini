# pytest.ini — настройки pytest для project_med (2026-10-25).
#
# norecursedirs: стандартный список pytest + _dev. Своё значение ЗАМЕНЯЕТ стандартное,
# поэтому стандартные имена перечислены явно. _dev/ исключён, чтобы не собирались копии
# модулей и тестов из _dev/backup/ и _dev/tmp/ (skill dev-rules).
[pytest]
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} _dev
