name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия тега (например, v1.0.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Create VERSION file from tag  # <-- НОВЫЙ ШАГ
        run: |
          $tag = "$env:GITHUB_REF_NAME" -replace '^v',''
          Write-Output $tag | Out-File -FilePath VERSION -Encoding utf8
          Get-Content VERSION
        shell: pwsh
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows executable
        run: python scripts/build_win.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalApp-windows
          path: dist/MedicalApp.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create VERSION file from tag  # <-- НОВЫЙ ШАГ
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "$TAG" > VERSION
          cat VERSION
      - name: Build Linux distribution
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalApp-linux
          path: MedicalApp-linux.tar.gz

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Determine version and prerelease
        id: version
        run: |
          TAG=${GITHUB_REF_NAME}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ $TAG == *"-pre"* ]] || [[ $TAG == *"-rc"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MedicalApp-windows/MedicalApp.exe
            artifacts/MedicalApp-linux/MedicalApp-linux.tar.gz
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true