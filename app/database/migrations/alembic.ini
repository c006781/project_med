# app/database/migrations/alembic.ini
#
# Только для запуска Alembic из консоли (разработка). Приложение этот файл не читает:
# app.database.migrate настраивает Alembic из кода.
#
#   alembic -c app/database/migrations/alembic.ini upgrade head
#   alembic -c app/database/migrations/alembic.ini revision --autogenerate -m "что меняем"

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../../..
# sqlalchemy.url = sqlite:///clinic.db
# ↑ до M11 (2026-10-18): из корня проекта это НАСТОЯЩАЯ база — консольный upgrade менял бы её
#   без резервной копии, блокировки и проверки связей. Теперь отдельная база разработчика
#   (*.db — в .gitignore). Обновить настоящую базу — запуском программы (app.database.migrate).
sqlalchemy.url = sqlite:///migrations_dev.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
